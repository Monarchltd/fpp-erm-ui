<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <style>
    .dc-1 { animation: spr 1s linear infinite; transform-origin: center; }
    .dc-2 { animation: spr-rev 1.5s linear infinite; transform-origin: center; }
    @keyframes spr { 100% { transform: rotate(360deg); } }
    @keyframes spr-rev { 100% { transform: rotate(-360deg); } }
  </style>
  <circle cx="25" cy="25" r="20" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" stroke-dasharray="40 40" class="dc-1"></circle>
  <circle cx="25" cy="25" r="14" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="25 25" class="dc-2"></circle>
</svg>